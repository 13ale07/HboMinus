<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel de Recomendaciones</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    .carousel-item img {
      height: 400px;
      object-fit: cover;
    }

    .carousel-caption {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      padding: 15px;
    }
  </style>
</head>

<body class="bg-dark text-white min-vh-100 d-flex align-items-center justify-content-center">

  <div class="container" style="max-width: 650px;">


    <div class="card bg-secondary text-white border-0 shadow-lg">
      <div class="card-body p-0 overflow-hidden rounded">


        <div id="carruselPeliculas" class="carousel slide" data-bs-ride="carousel">


          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carruselPeliculas" data-bs-slide-to="0" class="active"
              aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carruselPeliculas" data-bs-slide-to="1"
              aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carruselPeliculas" data-bs-slide-to="2"
              aria-label="Slide 3"></button>
          </div>


          <div class="carousel-inner">


            <div class="carousel-item active">
              <img
                src="https://media.gq.com.mx/photos/6885681c809dfe7144b84b75/16:9/w_2560%2Cc_limit/Five%2520Nights%2520at%2520Freddy's%2520(1).jpg"
                class="d-block w-100" alt="Imagen de Terror">
              <div class="carousel-caption">
                <h5 class="fw-bold text-uppercase tracking-wider">Recomendaciones</h5>
                <p class="fs-4 mb-0">Terror</p>
              </div>
            </div>


            <div class="carousel-item">
              <img src="https://media.dondeir.com/2022/02/before-sunrise-trilogia.jpg" class="d-block w-100"
                alt="Imagen de Romance">
              <div class="carousel-caption">
                <h5 class="fw-bold text-uppercase tracking-wider">Recomendaciones</h5>
                <p class="fs-4 mb-0">Romance</p>
              </div>
            </div>


            <div class="carousel-item">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpLXerXCjDfNUylihw_CrSJa8EHooSL95a6Ne6wD2DeB23JtNUeNsfCXU&s=10"
                class="d-block w-100" alt="Imagen de Comedia">
              <div class="carousel-caption">
                <h5 class="fw-bold text-uppercase tracking-wider">Recomendaciones</h5>
                <p class="fs-4 mb-0">Comedia</p>
              </div>
            </div>

          </div>


          <button class="carousel-control-prev" type="button" data-bs-target="#carruselPeliculas" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carruselPeliculas" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>

        </div>


      </div>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
