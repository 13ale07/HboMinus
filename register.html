<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      button.btn-provider {
        width: 200px;
      }
    </style>
  </head>
  <body>
    <!-- TODO Inicio del formulario JAiro -->

    <div class="container-sm text-center p-5 mt-4 rounded">
      <div class="conect-provider container-md mb-4">
        <h1>Conecta al proveedor</h1>
        <p>¿A través de qué proveedor te suscribiste?</p>
      </div>

      <div
        class="d-flex flex-row mb-3 justify-content-around flex-wrap row-gap-3 column-gap-2"
      >
        <button
          type="button"
          class="btn p-2 w-800 btn-outline-dark btn-provider"
        >
          TELMEX
        </button>

        <button type="button" class="btn btn-outline-dark btn-provider">
          GMAIL
        </button>
        <button type="button" class="btn btn-outline-dark btn-provider">
          CUENTA FAMILIAR
        </button>
      </div>

      <div
        class="d-flex flex-row mb-3 justify-content-around flex-wrap row-gap-3"
      >
        <button type="button" class="btn btn-outline-dark btn-provider">
          TELCEL
        </button>

        <button type="button" class="btn btn-outline-dark btn-provider">
          TOTALPLAY
        </button>

        <button type="button" class="btn btn-outline-dark btn-provider">
          MERCADOLIBRE
        </button>
      </div>

      <div
        class="d-flex flex-row mb-3 d-flex justify-content-around flex-wrap row-gap-3"
      >
        <button type="button" class="btn btn-outline-dark btn-provider">
          GENERATION
        </button>

        <button type="button" class="btn btn-outline-dark btn-provider">
          GRUPO SLIM
        </button>

        <button type="button" class="btn btn-outline-dark btn-provider">
          TELETON
        </button>
      </div>

      <div class="d-flex flex-row mb-3 justify-content-evenly flex-wrap">
        <button type="button" class="btn btn-outline-dark btn-provider">
          OXXO
        </button>
      </div>

      <p class="mb-4">
        <a href="#">
          ¿No ves a tu proveedor?
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-sign-turn-right-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M9.05.435c-.58-.58-1.52-.58-2.1 0L.436 6.95c-.58.58-.58 1.519 0 2.098l6.516 6.516c.58.58 1.519.58 2.098 0l6.516-6.516c.58-.58.58-1.519 0-2.098zM9 8.466V7H7.5A1.5 1.5 0 0 0 6 8.5V11H5V8.5A2.5 2.5 0 0 1 7.5 6H9V4.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L9.41 8.658A.25.25 0 0 1 9 8.466"
            />
          </svg>
        </a>
      </p>

      <div class="mb-2">
        <input
          type="email"
          class="form-control"
          id="exampleFormControlInput1"
          placeholder="Busca a tu proveedor"
        />
      </div>

      <table class="table table-hover">
        <tr>
          <td>Prime Video Channels</td>
        </tr>
        <tr>
          <td>StarTV</td>
        </tr>
        <tr>
          <td>Telcel</td>
        </tr>
        <tr>
          <td>Telmex</td>
        </tr>
        <tr>
          <td>Telnor</td>
        </tr>
        <tr>
          <td>Totalplay</td>
        </tr>
      </table>
    </div>
    <!-- ? Fin del formulario -->

      crossorigin="anonymous"
    ></script>
