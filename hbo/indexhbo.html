<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBO Minus</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c0f;
            color: #ffffff;
        }
        .dropdown-menu-dark {
            background-color: #151821;
            border: 1px solid #2a2e3d;
        }
        .dropdown-item:hover {
            background-color: #582be8;
        }
        /* Estilo para los textos/comentarios visuales en color verde */
        .comentario-verde {
            color: #28a745;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Contenedor alineado en columna -->
    <div class="container mt-4">
        <div class="d-flex flex-column align-items-start gap-3">

            <!-- Comentario HTML: Inicio del Botón 1 -->
            <div>
                <!-- Comentario visual en verde sobre el primer botón -->
                <p class="comentario-verde"><!-- Menú desplegable número 1 --></p>
                <div class="dropdown">
                    <button type="button" class="btn btn-outline-primary dropdown-toggle" id="dropBoton1" data-bs-toggle="dropdown" aria-expanded="false">
                        Botón 1
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropBoton1">
                        <li><a class="dropdown-item" href="#">Opción 1.1</a></li>
                        <li><a class="dropdown-item" href="#">Opción 1.2</a></li>
                    </ul>
                </div>
            </div>

            <!-- Comentario HTML: Inicio del Botón 2 -->
            <div>
                <!-- Comentario visual en verde sobre el segundo botón -->
                <p class="comentario-verde"><!-- Menú desplegable número 2 --></p>
                <div class="dropdown">
                    <button type="button" class="btn btn-outline-secondary dropdown-toggle" id="dropBoton2" data-bs-toggle="dropdown" aria-expanded="false">
                        Botón 2
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropBoton2">
                        <li><a class="dropdown-item" href="#">Opción 2.1</a></li>
                        <li><a class="dropdown-item" href="#">Opción 2.2</a></li>
                    </ul>
                </div>
            </div>

            <!-- Comentario HTML: Inicio del Botón 3 -->
            <div>
                <!-- Comentario visual en verde sobre el tercer botón -->
                <p class="comentario-verde"><!-- Menú desplegable número 3 --></p>
                <div class="dropdown">
                    <button type="button" class="btn btn-outline-success dropdown-toggle" id="dropBoton3" data-bs-toggle="dropdown" aria-expanded="false">
                        Botón 3
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropBoton3">
                        <li><a class="dropdown-item" href="#">Opción 3.1</a></li>
                        <li><a class="dropdown-item" href="#">Opción 3.2</a></li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container text-center mt-5">
        <h1 class="display-4 fw-bold">Bienvenido a HBO Minus</h1>
        <p class="lead text-secondary">Bienvenido a HBO. Ahora disfruta de cualquier contenido.</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
